<!doctype html>
<meta charset="utf-8" />
<title>Universal OSC Chat</title>
<link rel="stylesheet" href="./style.css" />

<div id="chatlog">
	<p id="welcome">Universal OSC Chat</p>
</div>

<div id="midbar">
	<span id="typing-indicator"></span>
	<span title="Periodically sends partially-typed messages.">
		<label for="realtime-text-toggle">Realtime Text</label>
		<input id="realtime-text-toggle" type="checkbox" disabled="" />
	</span>
	<span title="Shows the character limit and echoes your own messages.">
		<label for="vrc-mode-toggle">VRC Mode</label>
		<input id="vrc-mode-toggle" type="checkbox" />
	</span>
	<span id="char-counter" style="visibility:collapse"></span>
	<button id="clear-log" title="Clear history">♻</button>
</div>

<textarea id="inputbox" disabled="">Connecting…</textarea>

<script src="./index.js"></script>
